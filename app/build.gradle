plugins {
    id 'com.android.application'
}

// 签名信息放在本地 keystore.properties（已 gitignore），不入库
def keystorePropertiesFile = rootProject.file('keystore.properties')
def keystoreProperties = new Properties()
if (keystorePropertiesFile.exists()) {
    keystorePropertiesFile.withInputStream { keystoreProperties.load(it) }
}

android {
    namespace 'dev.ubox.app'
    compileSdk 36

    defaultConfig {
        applicationId "dev.ubox.app"
        minSdk 26
        targetSdk 36
        versionCode 8
        versionName "0.5.0"
        ndk {
            abiFilters 'arm64-v8a'
        }
    }

    signingConfigs {
        debug {
            // 只启用 v2/v3 签名（release 同）。
            // v2：APK 全文件签名，Android 7+ 必须；v3（PKCS#7）：支持密钥轮换，Android 9+ 推荐。
            // v1（JAR 签名）仅 Android 6 及以下需要，本项目 minSdk 26 用不到；
            // v4（增量安装签名）按需开启，这里不需要。
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
        release {
            if (keystorePropertiesFile.exists()) {
                storeFile rootProject.file(keystoreProperties.getProperty('storeFile'))
                storePassword keystoreProperties.getProperty('storePassword')
                keyAlias keystoreProperties.getProperty('keyAlias')
                keyPassword keystoreProperties.getProperty('keyPassword')
            }
            enableV1Signing false
            enableV2Signing true
            enableV3Signing true
            enableV4Signing false
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
        }
    }

    packagingOptions {
        jniLibs {
            // proot 及其 loader 必须解压到 nativeLibraryDir 才能被 exec（W^X）
            useLegacyPackaging = true
            // 使用 native/termux-jni 重编的 16KB 对齐版本，覆盖 AAR 自带的 4KB 版本
            pickFirsts += ['**/libtermux.so']
            excludes += ['**/x86/**', '**/x86_64/**', '**/armeabi-v7a/**']
            keepDebugSymbols += ['**/libproot.so', '**/libprootloader.so', '**/libprootloader32.so']
        }
    }

    androidResources {
        // rootfs 已经是 gzip，命名为 .bin 防止 aapt 解压/再压缩
        noCompress += ['bin']
    }

    buildFeatures {
        // 生成 BuildConfig.VERSION_NAME / VERSION_CODE，供设置页显示版本
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

def rootfsAsset = file('src/main/assets/rootfs.tar.gz.bin')
tasks.register('checkRootfs') {
    doLast {
        if (!rootfsAsset.isFile())
            throw new GradleException('缺少 rootfs，请先运行 scripts/fetch-rootfs.sh')
    }
}
tasks.named('preBuild') { dependsOn 'checkRootfs' }

dependencies {
    implementation 'com.termux.termux-app:terminal-view:0.118.0'
    implementation 'org.apache.commons:commons-compress:1.27.1'
    testImplementation 'junit:junit:4.13.2'
}
