org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
android.useAndroidX=true
# 关闭 release 资源优化（resource path shortening）。
# AGP 9.x 默认对 release 启用该优化，而本机构建用的是 ARM64 aapt2，其在优化路径上
# 有 bug：声称成功却写出不含 manifest/res/resources.arsc 的空资源 APK（debug 不跑
# 优化故正常）。关闭后 release 产物恢复正常。参见 revanced/aapt2 issue #36。
android.enableResourceOptimizations=false
